<text x="40.0" y="382.0" font-size="11.5" fill="#888780" text-anchor="start" font-weight="400" font-family="system-ui,&quot;Microsoft YaHei&quot;,sans-serif">真实反应器永远落在这一竖线与这条指数之间，偏移量由死区、短路、沟流共同决定。</text>
